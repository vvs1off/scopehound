[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scopehound"
version = "0.1.0"
description = "Passive scope validation for authorized engagements - no network, ever."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "recon", "scope", "bug-bounty", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/vvs1off/scopehound"
Issues = "https://github.com/vvs1off/scopehound/issues"

[project.scripts]
scopehound = "scopehound.cli:main"

[tool.setuptools.packages.find]
include = ["scopehound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
